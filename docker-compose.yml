services:
  postgres:
    # Postgres 16 + PostGIS (distributor search). 16-3.4: last tag with an arm64 build.
    image: postgis/postgis:16-3.4
    container_name: agri-media-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agri-media
      POSTGRES_DB: agri-media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agri-media-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: agri-media@gmail.com
      PGADMIN_DEFAULT_PASSWORD: agrimedia
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
